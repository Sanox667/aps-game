<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#070b16">
  <title>Монтажник АПС</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="stat"><span class="label">Объект</span><span class="value" id="hud-level">1</span></div>
      <div class="stat"><span class="label">Очки</span><span class="value" id="hud-score">0</span></div>
      <div class="stat"><span class="label">Задание</span><span class="value" id="hud-goal">0 / 5</span></div>
      <div class="stat danger-card" id="stat-time"><span class="label">Время</span><span class="value" id="hud-time">—</span></div>
      <div class="stat"><span class="label">Комбо</span><span class="value" id="hud-combo">—</span></div>
      <div class="stat"><span class="label">Рекорд</span><span class="value" id="hud-best">0</span></div>
      <button id="btn-sound" type="button" aria-label="Звук">🔊</button>
      <button id="btn-full" type="button" aria-label="Во весь экран">⛶</button>
      <button id="btn-char" type="button" aria-label="Сменить монтажника">👷</button>
    </header>

    <div id="stage">
      <canvas id="game" width="960" height="620"></canvas>
      <div id="toast" class="toast hidden"></div>
      <div id="joy" hidden><div id="joy-knob"></div></div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="panel">
        <h2 id="ov-title">Объект сдан</h2>
        <p id="ov-text"></p>
        <div id="ov-unlock"></div>
        <button id="ov-btn" type="button">Следующий объект</button>
      </div>
    </div>

    <div id="controls">
      <div class="actions">
        <button id="btn-cable" data-k="cable">〰️ Кабель</button>
        <button id="btn-action" data-k="action">🔧 Ставить</button>
      </div>
    </div>

    <footer id="hint">← → ходить · ↑ ↓ лестницы · C — кабель · Пробел — ставить · M — звук · R — заново · ⛶ — весь экран · 👤 — сменить монтажника</footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
