<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Монтажник АПС</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="stat"><span class="label">Смена</span><span class="value" id="hud-level">1</span></div>
      <div class="stat"><span class="label">Очки</span><span class="value" id="hud-score">0</span></div>
      <div class="stat"><span class="label">Задание</span><span class="value" id="hud-goal">0 / 5</span></div>
      <div class="stat"><span class="label">Комбо</span><span class="value" id="hud-combo">—</span></div>
      <div class="stat"><span class="label">Рекорд</span><span class="value" id="hud-best">0</span></div>
    </header>

    <div id="tools" class="tools"></div>

    <div id="stage">
      <canvas id="game" width="960" height="620"></canvas>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay hidden">
        <div class="panel">
          <h2 id="ov-title">Смена закрыта</h2>
          <p id="ov-text"></p>
          <div id="ov-unlock"></div>
          <button id="ov-btn" type="button">Следующая смена</button>
        </div>
      </div>
    </div>

    <div id="controls">
      <div class="dpad">
        <button data-k="left" aria-label="Влево">◀</button>
        <button data-k="right" aria-label="Вправо">▶</button>
      </div>
      <div class="dpad vertical">
        <button data-k="up" aria-label="Вверх">▲</button>
        <button data-k="down" aria-label="Вниз">▼</button>
      </div>
      <button id="btn-action" data-k="action">🔧 Ставить</button>
    </div>

    <footer id="hint">← → ходить · ↑ ↓ лестницы · Пробел — установить · R — заново</footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
